# Usage: uv run capx/envs/launch.py --config-path env_configs/spill_wipe/franka_robosuite_spill_wipe_variants.yaml
#
# Robustness-eval variant of the spill_wipe task (WipeVariants, see
# capx/envs/simulators/robosuite_spill_wipe_variants.py). `low_level` is a _target_-based dict
# rather than a plain registry string -- that's what lets `variation` be forwarded straight
# into FrankaRobosuiteSpillWipeVariantsLowLevel / WipeVariants.
#
# Available presets (set `low_level.variation` to one of these):
#   baseline, color_shift_mild, color_shift_strong, object_position_shift,
#   robot_position_shift, lighting_bright, lighting_dim, distractor_object,
#   target_object_swap, language_paraphrase, compound_hard
# (target_object_swap is adapted for this task: no discrete object exists to swap, so it
#  toggles the dirt pattern from one continuous path to two independent clusters instead.)

env:
  _target_: capx.envs.tasks.franka.franka_spill_wipe.FrankaSpillWipeCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.robosuite_spill_wipe_variants.FrankaRobosuiteSpillWipeVariantsLowLevel
      privileged: false
      enable_render: true
      variation: color_shift_mild
    privileged: false
    apis:
      - FrankaControlSpillWipeApi
    # The class default prompt (FrankaSpillWipeCodeEnv's) says "the 'brown spill'", which is
    # wrong once color_shift_mild retints it -- see variants_common.py's module docstring.
    # `prompt:` below matches what
    # capx.envs.simulators.variant_prompts.resolve_prompt("spill_wipe", "color_shift_mild")
    # returns; the claude-code sweep script's yaml-patching step calls this for you when it
    # switches variation to something else.
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: wipe up the 'spill'.
      A sponge is already attached to your gripper/end-effector.
      The table surface height is exactly z = 0.0 m, and wiping should be performed at that height (no extra offset).
      Use the spill extents to inform the min/max x and y bounds of wiping motions.
      Avoid large wiping motions since large deltas between inverse kinematics solutions may not guarantee optimal trajectories.
      A sponge is already attached to the end-effector, and you should use a downward-facing orientation (0,0,1,0 wxyz) for wiping.
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/franka_robosuite_spill_wipe_variants

trials: 100
num_workers: 12
