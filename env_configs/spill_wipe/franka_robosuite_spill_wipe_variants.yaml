# Usage: uv run capx/envs/launch.py --config-path env_configs/spill_wipe/franka_robosuite_spill_wipe_variants.yaml
#
# Robustness-eval variant of the spill_wipe task (WipeVariants, see
# capx/envs/simulators/robosuite_spill_wipe_variants.py). `low_level` is a _target_-based dict
# rather than a plain registry string -- that's what lets `variation` be forwarded straight
# into FrankaRobosuiteSpillWipeVariantsLowLevel / WipeVariants.
#
# Available presets (set `low_level.variation` to one of these):
#   baseline, color_shift_mild, color_shift_strong, object_position_shift,
#   robot_position_shift, lighting_bright, lighting_dim, distractor_object,
#   target_object_swap, language_paraphrase, compound_hard
# (target_object_swap is adapted for this task: no discrete object exists to swap, so it
#  toggles the dirt pattern from one continuous path to two independent clusters instead.)

env:
  _target_: capx.envs.tasks.franka.franka_spill_wipe.FrankaSpillWipeCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.robosuite_spill_wipe_variants.FrankaRobosuiteSpillWipeVariantsLowLevel
      privileged: false
      enable_render: true
      variation: color_shift_mild
    privileged: false
    apis:
      - FrankaControlSpillWipeApi
    # prompt is inherited from FrankaSpillWipeCodeEnv class default

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/franka_robosuite_spill_wipe_variants

trials: 100
num_workers: 12
