# Usage: uv run capx/envs/launch.py --config-path env_configs/nut_assembly/franka_robosuite_nut_assembly_variants.yaml
#
# Robustness-eval variant of the nut_assembly task (NutAssemblyVariants, see
# capx/envs/simulators/robosuite_nut_assembly_variants.py). `low_level` is a _target_-based
# dict rather than a plain registry string -- that's what lets `variation` be forwarded
# straight into FrankaRobosuiteNutAssemblyVariantsLowLevel / NutAssemblyVariants.
#
# NOTE: this points at the non-visual FrankaRobosuiteNutAssembly control interface (the
# Variants class mirrors that one, not FrankaRobosuiteNutAssemblyVisual), so the API below is
# FrankaControlApi rather than the production config's FrankaControlNutAssemblyVisualApi.
#
# Available presets (set `low_level.variation` to one of these):
#   baseline, color_shift_mild, color_shift_strong, object_position_shift,
#   robot_position_shift, lighting_bright, lighting_dim, distractor_object,
#   target_object_swap, language_paraphrase, compound_hard

env:
  _target_: capx.envs.tasks.franka.franka_nut_assembly.FrankaNutAssemblyCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.robosuite_nut_assembly_variants.FrankaRobosuiteNutAssemblyVariantsLowLevel
      privileged: true
      enable_render: true
      variation: color_shift_mild
    privileged: true
    apis:
      - FrankaControlApi
    # The class default prompt (FrankaNutAssemblyCodeEnv's) says "brown square nut" -- wrong
    # once color_shift_mild retints it, and this wording is also the literal vision-grounding
    # query text passed to get_object_pose/sample_grasp_pose (see variants_common.py's module
    # docstring). `prompt:` below matches what
    # capx.envs.simulators.variant_prompts.resolve_prompt("nut_assembly", "color_shift_mild")
    # returns; the claude-code sweep script's yaml-patching step calls this for you when it
    # switches variation to something else.
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: grasp and insert the `square nut` onto the `brown square block`.
      Note that you would grasp the nut by its handle. You can try language query `extruded handle of the square nut` to get a good grasp at the handle.
      The square nut and the extruded handle of the square nut are part of the same rigid body.
      The grasp pose query for 'extruded handle of the square nut' returns an end-effector pose expressed in world frame, located on the handle region.
      The nut's object center pose obtained via 'white hollow center of the square nut' and the handle grasp pose obtained via 'extruded handle of the square nut' have a fixed rigid transform, which must be applied correctly when inserting the nut onto the peg.
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      The functions (APIs) below are already imported to the environment.
      If you want to use numpy, or scipy for spatial transformations, you need to import it explicitly.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/franka_robosuite_nut_assembly_variants
use_oracle_code: false
trials: 100
num_workers: 12
