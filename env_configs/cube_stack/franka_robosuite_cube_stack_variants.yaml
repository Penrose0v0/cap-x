# Usage: uv run capx/envs/launch.py --config-path env_configs/cube_stack/franka_robosuite_cube_stack_variants.yaml
#
# Robustness-eval variant of the cube_stack task (StackVariants, see
# capx/envs/simulators/robosuite_cubes_variants.py). Unlike franka_robosuite_cube_stack.yaml,
# `low_level` here is a _target_-based dict rather than a plain registry string -- that's what
# lets `variation` be forwarded straight into FrankaRobosuiteCubesVariantsLowLevel / StackVariants.
#
# Available presets (set `low_level.variation` to one of these):
#   baseline, color_shift_mild, color_shift_strong, object_position_shift,
#   robot_position_shift, lighting_bright, lighting_dim, distractor_object,
#   target_object_swap, language_paraphrase, compound_hard

env:
  _target_: capx.envs.tasks.franka.franka_pick_place.FrankaPickPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.robosuite_cubes_variants.FrankaRobosuiteCubesVariantsLowLevel
      privileged: false
      enable_render: true
      variation: color_shift_mild
    privileged: false
    apis:
      - FrankaControlApi
    # The class default prompt (FrankaPickPlaceCodeEnv's) says "red cube"/"green cube", which is
    # wrong once color_shift_mild retints both cubes to the same color -- so `prompt:` below is
    # set explicitly to the corrected text for variation: color_shift_mild (matches what
    # capx.envs.simulators.variant_prompts.resolve_prompt("cube_stack", "color_shift_mild")
    # returns; the claude-code sweep script's yaml-patching step calls this for you when it
    # switches variation to something else). See variants_common.py's module docstring for the
    # full list of which presets need this.
    prompt: |
      You are controlling a Franka Emika robot with the API described below.
      Goal: Pick up the smaller cube and gently stack it on top of the larger cube, then release it.

      Key rules:
      - The extent from get_object_pose(..., return_bbox_extent=True) is the FULL side length. Use extent[2]/2 for half-height.
      - For placement orientation, reuse the grasp quaternion from sample_grasp_pose. Do NOT use the quaternion from get_object_pose (it is unreliable for orientation).
      - Always use z_approach=0.1 when approaching an object for grasping or placing.
      - After grasping, lift the cube to a safe height (at least +0.2m in Z) before moving laterally to the placement location.
      - The stacking height formula is: place_z = larger_center_z + larger_extent[2]/2 + smaller_extent[2]/2
      - Nothing should be dropped from a height. Always approach with z_approach for controlled descent.

      Write ONLY executable Python code (no code fences). Import numpy if needed.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/franka_robosuite_cube_stack_variants

trials: 100
num_workers: 12
