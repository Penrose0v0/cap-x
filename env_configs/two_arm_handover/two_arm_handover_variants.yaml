# Usage: uv run capx/envs/launch.py --config-path env_configs/two_arm_handover/two_arm_handover_variants.yaml
#
# Robustness-eval variant of the two_arm_handover task (TwoArmHandoverVariants, see
# capx/envs/simulators/robosuite_handover_variants.py). `low_level` is a _target_-based dict
# rather than a plain registry string -- that's what lets `variation` be forwarded straight
# into RobosuiteHandoverVariantsEnv / TwoArmHandoverVariants.
#
# Available presets (set `low_level.variation` to one of these):
#   baseline, color_shift_mild, color_shift_strong, object_position_shift,
#   robot_position_shift, lighting_bright, lighting_dim, distractor_object,
#   target_object_swap, language_paraphrase, compound_hard
# (robot_position_shift applies the same offset to BOTH arm bases -- see
#  TwoArmHandoverVariants._apply_robot_offset's docstring for why.)

env:
  _target_: capx.envs.tasks.franka.two_arm_handover.TwoArmHandoverCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.robosuite_handover_variants.RobosuiteHandoverVariantsEnv
      privileged: false
      enable_render: true
      variation: color_shift_mild
    apis:
      - FrankaHandoverApi
    # prompt is inherited from TwoArmHandoverCodeEnv class default here -- NOT correct for
    # target_object_swap: the swap kwargs deliberately make the hammer "look like a
    # visually-distinct tool (e.g. a mallet)" (see robosuite_handover_variants.py), but this
    # class default still says "hammer" throughout (see variants_common.py's module
    # docstring). No color word in this prompt, so color_shift_mild/strong are unaffected. Set
    # `prompt:` explicitly (or use
    # capx.envs.simulators.variant_prompts.resolve_prompt("two_arm_handover", variation)) to
    # get the corrected text for target_object_swap.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
output_dir: ./outputs/two_arm_handover_variants

trials: 100
num_workers: 5
use_oracle_code: false
